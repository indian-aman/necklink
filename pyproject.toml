[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "necklink"
version = "1.2.0"
description = "NLTP: loss-resilient file and telemetry transport over unreliable wireless and satellite links (Python + zero-heap ANSI C99)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Amandeep Bains"}
]
keywords = ["udp", "fec", "telemetry", "marine", "iot", "esp32", "nat-traversal", "chacha20-poly1305"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: C",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
]
dependencies = [
  "numpy>=1.24",
  "cryptography>=41.0",
]

[project.optional-dependencies]
quic = ["aioquic>=1.0"]
torch = ["torch>=2.0"]
dev = ["pytest>=7.0", "aioquic>=1.0"]

[project.scripts]
necklink = "necklink.cli:main"
nltp = "necklink.cli:main"

[tool.setuptools.packages.find]
include = ["necklink*", "nltp*"]
