name: packages-ci

# Tests NeckCompass, NeckCord, NeckSense and NeckSight (NLTP has its own tooling).
on:
  push:
    paths:
      - "packages/neckcompass/**"
      - "packages/neckcord/**"
      - "packages/necksense/**"
      - "packages/necksight/**"
      - ".github/workflows/packages-ci.yml"
  pull_request:
    paths:
      - "packages/neckcompass/**"
      - "packages/neckcord/**"
      - "packages/necksense/**"
      - "packages/necksight/**"
      - ".github/workflows/packages-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.package }} / py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [neckcompass, neckcord, necksense, necksight]
        python: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: C99 core and self-tests (-std=c99 -Wall -Wextra -pedantic -Werror)
        run: make -C csrc clean all test
      - name: Build the wheel and install it (not the source tree)
        run: |
          python -m pip install --upgrade pip build pytest
          python -m build --wheel --outdir dist .
          python -m pip install dist/*.whl
      - name: CLI smoke test
        run: |
          ${{ matrix.package }} --version
          ${{ matrix.package }} demo > /dev/null
      - name: Tests (includes running every README example)
        run: |
          mkdir -p /tmp/t && cp -r tests README.md pyproject.toml csrc /tmp/t/
          cd /tmp/t && python -m pytest -q -p no:cacheprovider tests
