name: packages-ci

# Tests NeckCompass, NeckCord, NeckSense, NeckSight, NeckLink CNS and NLTP.
on:
  push:
    paths:
      - "packages/neckcompass/**"
      - "packages/neckcord/**"
      - "packages/necksense/**"
      - "packages/necksight/**"
      - "packages/necklink_cns/**"
      - "packages/nltp/**"
      - "umbrella/**"
      - ".github/workflows/packages-ci.yml"
  pull_request:
    paths:
      - "packages/neckcompass/**"
      - "packages/neckcord/**"
      - "packages/necksense/**"
      - "packages/necksight/**"
      - "packages/necklink_cns/**"
      - "packages/nltp/**"
      - "umbrella/**"
      - ".github/workflows/packages-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.package }} / py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [neckcompass, neckcord, necksense, necksight]
        python: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: C99 core and self-tests (-std=c99 -Wall -Wextra -pedantic -Werror)
        run: make -C csrc clean all test
      - name: Build the wheel and install it (not the source tree)
        run: |
          python -m pip install --upgrade pip build pytest
          python -m build --wheel --outdir dist .
          python -m pip install dist/*.whl
      - name: CLI smoke test
        run: |
          ${{ matrix.package }} --version
          ${{ matrix.package }} demo > /dev/null
      - name: Tests (includes running every README example and Arduino SHA-256 parity)
        run: |
          mkdir -p /tmp/t && cp -r tests README.md pyproject.toml csrc arduino /tmp/t/
          cd /tmp/t && python -m pytest -q -p no:cacheprovider tests

  necklink_cns:
    name: necklink_cns / py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: packages/necklink_cns
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: C99 Whole-CNS core + ASan/UBSan self-tests (<24 KB SRAM, 0 floats, 0 heap)
        run: make -C csrc clean all test sanitize
      - name: Build and install organ + necklink-cns wheels
        run: |
          python -m pip install --upgrade pip build pytest
          python -m pip install ../neckcompass ../neckcord ../necksense ../necksight
          python -m build --wheel --outdir dist .
          python -m pip install dist/*.whl
      - name: CLI smoke test
        run: |
          necklink-cns --version
          necklink-cns demo > /dev/null
          necklink-cns priors > /dev/null
      - name: Tests (MAVLink v2, ROS2 adapter, closed-loop pole dodge & Arduino parity)
        run: |
          mkdir -p /tmp/t_cns && cp -r tests README.md pyproject.toml csrc arduino /tmp/t_cns/
          cd /tmp/t_cns && python -m pytest -q -p no:cacheprovider tests

  nltp:
    name: nltp / py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: packages/nltp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: C99 core self-tests (-Werror) and ESP-NOW hub simulation
        run: make -C csrc clean all test espnow-sim
      - name: C99 self-tests under AddressSanitizer + UBSan (full + 4.7 KB NLTP_TX_ONLY)
        run: |
          gcc -O1 -g -std=c99 -Wall -Wextra -pedantic -Werror -fsanitize=address,undefined \
              -fno-sanitize-recover=undefined -Icsrc -o /tmp/nltp_selftest_asan \
              csrc/tools/nltp_selftest.c csrc/nltp_core.c csrc/nltp_sha256.c
          /tmp/nltp_selftest_asan
          gcc -O1 -g -std=c99 -Wall -Wextra -pedantic -Werror -DNLTP_TX_ONLY=1 -fsanitize=address,undefined \
              -fno-sanitize-recover=undefined -Icsrc -o /tmp/nltp_txonly_asan \
              csrc/tools/nltp_txonly_selftest.c csrc/nltp_core.c csrc/nltp_sha256.c
          /tmp/nltp_txonly_asan
      - name: Python package (wheel install) and tests
        run: |
          python -m pip install --upgrade pip build pytest
          python -m build --wheel --outdir dist .
          python -m pip install ../neckcompass ../neckcord ../necksense ../necksight dist/*.whl
          nltp --help > /dev/null
          python -m pytest -q tests
      - name: JavaScript SDK tests
        working-directory: packages/nltp/js
        run: npm test
      - name: Java SDK build and self-tests
        working-directory: packages/nltp/java
        run: mvn -B package   # the test phase runs NLTPSelfTest (8 self-tests) before the JAR is built
      - name: Cross-language interop (C <-> Python 72, Python/C/JS/Java 248 incl. 4x4 LZ4)
        run: |
          python scripts/c_interop_test.py
          python scripts/multilang_interop_test.py
      - name: Real-project examples (vessel/shore demo, shore dashboard, ESP32 sensor -> gateway -> shore sketches)
        run: |
          python examples/python/05_vessel_shore_link.py demo --loss 0.15
          node examples/javascript/shore_dashboard.mjs --demo
          python scripts/esp32_sketch_e2e_test.py
