name: packages-ci

# Tests NeckCompass, NeckCord, NeckSense, NeckSight and NLTP.
on:
  push:
    paths:
      - "packages/neckcompass/**"
      - "packages/neckcord/**"
      - "packages/necksense/**"
      - "packages/necksight/**"
      - "packages/nltp/**"
      - ".github/workflows/packages-ci.yml"
  pull_request:
    paths:
      - "packages/neckcompass/**"
      - "packages/neckcord/**"
      - "packages/necksense/**"
      - "packages/necksight/**"
      - "packages/nltp/**"
      - ".github/workflows/packages-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.package }} / py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [neckcompass, neckcord, necksense, necksight]
        python: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: C99 core and self-tests (-std=c99 -Wall -Wextra -pedantic -Werror)
        run: make -C csrc clean all test
      - name: Build the wheel and install it (not the source tree)
        run: |
          python -m pip install --upgrade pip build pytest
          python -m build --wheel --outdir dist .
          python -m pip install dist/*.whl
      - name: CLI smoke test
        run: |
          ${{ matrix.package }} --version
          ${{ matrix.package }} demo > /dev/null
      - name: Tests (includes running every README example)
        run: |
          mkdir -p /tmp/t && cp -r tests README.md pyproject.toml csrc /tmp/t/
          cd /tmp/t && python -m pytest -q -p no:cacheprovider tests

  nltp:
    name: nltp / py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: packages/nltp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: C99 core self-tests (-Werror) and ESP-NOW hub simulation
        run: make -C csrc clean all test espnow-sim
      - name: C99 self-tests under AddressSanitizer + UBSan
        run: |
          gcc -O1 -g -std=c99 -Wall -Wextra -pedantic -Werror -fsanitize=address,undefined \
              -fno-sanitize-recover=undefined -Icsrc -o /tmp/nltp_selftest_asan \
              csrc/tools/nltp_selftest.c csrc/nltp_core.c csrc/nltp_sha256.c
          /tmp/nltp_selftest_asan
      - name: Python package (wheel install) and tests
        run: |
          python -m pip install --upgrade pip build pytest
          python -m build --wheel --outdir dist .
          python -m pip install dist/*.whl
          nltp --help > /dev/null
          python -m pytest -q tests
      - name: JavaScript SDK tests
        working-directory: packages/nltp/js
        run: npm test
      - name: Java SDK build and self-tests
        working-directory: packages/nltp/java
        run: |
          mvn -q -B package -DskipTests
          javac --release 11 -cp target/nltp-1.3.2.jar -d target/test-classes src/test/java/io/necklink/nltp/*.java
          java -cp "target/nltp-1.3.2.jar:target/test-classes" io.necklink.nltp.NLTPSelfTest
      - name: Cross-language interop (C <-> Python 72, Python/C/JS/Java 216)
        run: |
          python scripts/c_interop_test.py
          python scripts/multilang_interop_test.py
      - name: Real-project examples (vessel/shore demo, shore dashboard, ESP32 sensor -> gateway -> shore sketches)
        run: |
          python examples/python/05_vessel_shore_link.py demo --loss 0.15
          node examples/javascript/shore_dashboard.mjs --demo
          python scripts/esp32_sketch_e2e_test.py
