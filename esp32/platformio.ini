; NLTP on ESP32 (Arduino framework). The protocol engine is csrc/nltp_core.c, compiled unchanged.
; Wi-Fi credentials: copy include/secrets.h.example to include/secrets.h and fill it in yourself.
;   python -m platformio run -d esp32 -t upload      (build + flash)
;   python -m platformio device monitor -d esp32     (serial console)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM9
monitor_port = COM9
monitor_speed = 115200
build_flags =
    -I../csrc
    -DNLTP_RX_SLOTS=8
    -DNLTP_RX_MAX_GENS=512
    -O2
