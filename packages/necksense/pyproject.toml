[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "necksense"
version = "3.0.0"
description = "Drosophila Antennal Lobe, Chordotonal Organ & Mushroom Body load/concentration-invariant sparse hashing, 1-shot vibration & gas anomaly detection, and zero-forgetting associative classification in Python, ANSI C99 (< 6 KB MCU SRAM), and Arduino"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Amandeep Singh Bains"}
]
keywords = [
  "necksense",
  "necklink",
  "drosophila",
  "flyhash",
  "mushroom-body",
  "antennal-lobe",
  "chordotonal",
  "kenyon-cells",
  "locality-sensitive-hashing",
  "anomaly-detection",
  "novelty-detection",
  "vibration-analysis",
  "bearing-fault",
  "olfaction",
  "e-nose",
  "embedded-ai",
  "arduino",
  "esp32",
  "tinyml",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: C",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: System :: Hardware",
]
dependencies = [
  "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/indian-aman/necklink/tree/main/packages/necksense"
Repository = "https://github.com/indian-aman/necklink/tree/main/packages/necksense"
Releases = "https://github.com/indian-aman/necksense/releases"
Issues = "https://github.com/indian-aman/necklink/issues"
Documentation = "https://github.com/indian-aman/necklink/tree/main/packages/necksense#readme"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "matplotlib>=3.7",
  "build>=1.0",
  "twine>=5.0",
]

[project.scripts]
necksense = "necksense.cli:main"

[tool.setuptools.packages.find]
include = ["necksense*"]

[tool.setuptools.package-data]
necksense = ["data/*.npz"]
