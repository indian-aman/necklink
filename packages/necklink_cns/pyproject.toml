[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "necklink-cns"
version = "2.0.0"
description = "Unified Adult Drosophila Whole-CNS Edge Autonomy Controller (BANC v888 Descending Arbitration, <24 KB Zero-Float ANSI C99, MAVLink v2 & ROS 2 Bridges)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Amandeep Singh Bains"}
]
keywords = [
  "necklink",
  "drosophila",
  "connectome",
  "mavlink",
  "ros2",
  "ardupilot",
  "px4",
  "esp32",
  "neuromorphic",
  "robotics",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: C",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.22",
  "necksight>=2.0.0",
  "neckcompass>=2.0.0",
  "neckcord>=2.0.0",
  "necksense>=2.0.0",
]

[project.optional-dependencies]
wire = ["pynltp>=1.6.0"]

[project.scripts]
necklink-cns = "necklink_cns.cli:main"

[project.urls]
Homepage = "https://github.com/indian-aman/necklink/tree/main/packages/necklink_cns"
Repository = "https://github.com/indian-aman/necklink"

[tool.setuptools.packages.find]
include = ["necklink_cns*"]

[tool.setuptools.package-data]
necklink_cns = ["banc_v888_priors.json"]
