; Unified 3-Node Interconnected NLTP Mesh + Gateway + ESP-NOW Benchmark Firmware
; Node 0 (COM9)  = Gateway (ONLY node connected to home Wi-Fi; bridges Laptop UDP <-> L2 Mesh)
; Node 1 (COM11) = Room 2 Relay Peer (OFF home Wi-Fi; pure L2 ESP-NOW / NLTP-NOW + multi-hop relay)
; Node 2 (COM12) = Room 3 Leaf Peer  (OFF home Wi-Fi; pure L2 ESP-NOW / NLTP-NOW + SoftAP test client)

[env]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 115200
monitor_speed = 115200
build_src_filter = +<main.cpp> +<nltp_core_build.c>
build_flags =
    -I../csrc
    -I../esp32/include
    -DNLTP_RX_SLOTS=8
    -DNLTP_RX_MAX_GENS=128
    -O2

[env:node0_gw]
upload_port = COM9
monitor_port = COM9
build_flags = ${env.build_flags} -DMESH_NODE_ID=0

[env:node1_relay]
upload_port = COM11
monitor_port = COM11
build_flags = ${env.build_flags} -DMESH_NODE_ID=1

[env:node2_leaf]
upload_port = COM12
monitor_port = COM12
build_flags = ${env.build_flags} -DMESH_NODE_ID=2

; Zero-Wrapper ESP-NOW v2 (1,470 B MTU) Wire-Interop Verification Environments
; interop_bridge_com9 = C99 nltp_espnow_hub_t + SLIP L2 Tunnel for Host Python pynltp
; interop_node_com12  = Arduino C++ NLTPESPNowNode (<NLTP.h>)
[env:interop_bridge_com9]
upload_port = COM9
monitor_port = COM9
build_src_filter = +<interop_v2_main.cpp> +<nltp_core_build.c>
build_flags =
    -I../csrc
    -I../arduino/NLTP/src
    -DNLTP_RX_SLOTS=2
    -DNLTP_RX_MAX_GENS=64
    -DNLTP_ESPNOW_MAX_PEERS=2
    -DINTEROP_ROLE=0
    -O2

[env:interop_node_com12]
upload_port = COM12
monitor_port = COM12
build_src_filter = +<interop_v2_main.cpp> +<nltp_core_build.c>
build_flags =
    -I../csrc
    -I../arduino/NLTP/src
    -DNLTP_RX_SLOTS=4
    -DNLTP_RX_MAX_GENS=64
    -DNLTP_ESPNOW_MAX_PEERS=2
    -DINTEROP_ROLE=1
    -O2

; Pure Off-Wi-Fi 3-Node NLTP 1.4.0 ESP-NOW v2 vs Raw ESP-NOW v2 Mesh & Benchmark Environments
[env:mesh3_node0]
upload_port = COM9
monitor_port = COM9
build_src_filter = +<mesh3_v2_main.cpp> +<nltp_core_build.c>
build_flags =
    -I../csrc
    -I../arduino/NLTP/src
    -DNLTP_RX_SLOTS=2
    -DNLTP_RX_MAX_GENS=64
    -DNLTP_ESPNOW_MAX_PEERS=2
    -DMESH3_NODE_ID=0
    -O2

[env:mesh3_node1]
upload_port = COM11
monitor_port = COM11
build_src_filter = +<mesh3_v2_main.cpp> +<nltp_core_build.c>
build_flags =
    -I../csrc
    -I../arduino/NLTP/src
    -DNLTP_RX_SLOTS=2
    -DNLTP_RX_MAX_GENS=64
    -DNLTP_ESPNOW_MAX_PEERS=2
    -DMESH3_NODE_ID=1
    -O2

[env:mesh3_node2]
upload_port = COM12
monitor_port = COM12
build_src_filter = +<mesh3_v2_main.cpp> +<nltp_core_build.c>
build_flags =
    -I../csrc
    -I../arduino/NLTP/src
    -DNLTP_RX_SLOTS=2
    -DNLTP_RX_MAX_GENS=64
    -DNLTP_ESPNOW_MAX_PEERS=2
    -DMESH3_NODE_ID=2
    -O2
