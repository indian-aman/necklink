; Unified 3-Node Interconnected NLTP Mesh + Gateway + ESP-NOW Benchmark Firmware
; Node 0 (COM9)  = Gateway (ONLY node connected to home Wi-Fi; bridges Laptop UDP <-> L2 Mesh)
; Node 1 (COM11) = Room 2 Relay Peer (OFF home Wi-Fi; pure L2 ESP-NOW / NLTP-NOW + multi-hop relay)
; Node 2 (COM12) = Room 3 Leaf Peer  (OFF home Wi-Fi; pure L2 ESP-NOW / NLTP-NOW + SoftAP test client)

[env]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 115200
monitor_speed = 115200
build_flags =
    -I../csrc
    -I../esp32/include
    -DNLTP_RX_SLOTS=8
    -DNLTP_RX_MAX_GENS=128
    -O2

[env:node0_gw]
upload_port = COM9
monitor_port = COM9
build_flags = ${env.build_flags} -DMESH_NODE_ID=0

[env:node1_relay]
upload_port = COM11
monitor_port = COM11
build_flags = ${env.build_flags} -DMESH_NODE_ID=1

[env:node2_leaf]
upload_port = COM12
monitor_port = COM12
build_flags = ${env.build_flags} -DMESH_NODE_ID=2
