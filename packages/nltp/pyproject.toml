[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pynltp"
version = "1.3.1"
description = "NeckLink NLTP v1.3: loss-resilient ChaCha20-Poly1305 encrypted UDP file, telemetry & Drosophila CNS reflex transport with GF(2^8) Cauchy FEC and 4G CGNAT traversal"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Amandeep Singh Bains"}
]
keywords = [
  "nltp",
  "pynltp",
  "necklink",
  "udp",
  "fec",
  "cauchy",
  "galois-field",
  "telemetry",
  "marine",
  "iot",
  "esp32",
  "stun",
  "cgnat",
  "nat-traversal",
  "chacha20-poly1305",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Telecommunications Industry",
  "Operating System :: OS Independent",
  "Programming Language :: C",
  "Programming Language :: Java",
  "Programming Language :: JavaScript",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet",
  "Topic :: System :: Networking",
]
dependencies = [
  "numpy>=1.24",
  "cryptography>=41.0",
]

[project.urls]
Homepage = "https://github.com/indian-aman/necklink"
Repository = "https://github.com/indian-aman/necklink"
Releases = "https://github.com/indian-aman/necklink/releases"
Issues = "https://github.com/indian-aman/necklink/issues"
Documentation = "https://github.com/indian-aman/necklink/tree/main/packages/nltp#readme"

[project.optional-dependencies]
suite = [
  "necksense>=1.0.0",
  "neckcompass>=1.0.0",
  "necksight>=1.0.0",
  "neckcord>=1.0.0",
]
quic = ["aioquic>=1.0"]
torch = ["torch>=2.0"]
dev = ["pytest>=7.0", "aioquic>=1.0"]

[project.scripts]
pynltp = "necklink.cli:main"
nltp = "necklink.cli:main"
necklink = "necklink.cli:main"

[tool.setuptools.packages.find]
include = ["pynltp*", "nltp*", "necklink*"]
