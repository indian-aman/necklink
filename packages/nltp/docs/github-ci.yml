name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-c-and-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build zero-heap ANSI C99 core & run 22/22 self-tests + 4.76 KB NLTP_TX_ONLY profile
        run: |
          make -C csrc clean all test espnow-sim

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java (Temurin JDK 21, targeting Java 11 bytecode)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Build zero-dep Java SDK (--release 11) & run 8/8 Java self-tests
        run: |
          mkdir -p java/target/classes java/target/test-classes
          javac --release 11 -Xlint:all -Werror -d java/target/classes java/src/main/java/io/necklink/nltp/*.java
          jar --create --file java/target/nltp-1.6.0.jar --main-class io.necklink.nltp.NLTPCli -C java/target/classes .
          javac --release 11 -Xlint:all -Werror -cp java/target/nltp-1.6.0.jar -d java/target/test-classes java/src/test/java/io/necklink/nltp/*.java
          java -cp "java/target/nltp-1.6.0.jar:java/target/test-classes" io.necklink.nltp.NLTPSelfTest

      - name: Run JavaScript / TypeScript SDK test suite
        run: |
          node --test js/test/nltp.test.mjs

      - name: Install Python package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,quic]"

      - name: Run Python test suite
        run: |
          pytest tests -v

      - name: Run 248-case 4-language (Python <-> C99 <-> JS <-> Java) wire, X25519 PFS & LZ4 interop suite
        if: matrix.python-version == '3.12'
        run: |
          python scripts/multilang_interop_test.py
